<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    /* ===== CSS Variables ===== */
    :root {
      --bg-primary: #0f0e17;
      --bg-card: #1a1a2e;
      --bg-input: #16213e;
      --accent-purple: #7c3aed;
      --accent-purple-hover: #6d28d9;
      --accent-pink: #ec4899;
      --accent-teal: #14b8a6;
      --accent-amber: #f59e0b;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: #2d2d44;
      --delete-btn: #ef4444;
      --delete-btn-hover: #dc2626;
      --shadow: 0 4px 24px rgba(124, 58, 237, 0.15);
      --radius: 14px;
      --radius-sm: 8px;
    }

    /* ===== Reset & Base ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 0 0 40px;
    }

    /* ===== Header ===== */
    .app-header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .app-header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ===== Dark/Light Mode Toggle ===== */
    .header-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .theme-toggle {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 12px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--accent-purple);
      color: var(--text-primary);
    }

    /* ===== Light Mode ===== */
    body.light-mode {
      --bg-primary: #f1f5f9;
      --bg-card: #ffffff;
      --bg-input: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --shadow: 0 4px 24px rgba(124, 58, 237, 0.08);
    }

    body.light-mode .app-header {
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
    }

    /* ===== Main Container ===== */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ===== Card ===== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    /* ===== Balance Card ===== */
    .balance-card {
      text-align: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #1a1a2e 100%);
      border: 1px solid rgba(124, 58, 237, 0.3);
      position: relative;
      overflow: hidden;
    }

    .balance-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at center, rgba(124, 58, 237, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .balance-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .balance-amount {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent-teal), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }

    .balance-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* ===== Spending Limit Banner ===== */
    .limit-banner {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: var(--radius-sm);
      padding: 10px 16px;
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 500;
      margin-top: 12px;
    }

    .limit-banner.show {
      display: flex;
    }

    /* ===== Form ===== */
    .form-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.9rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }

    .form-group select option {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .form-group input.error,
    .form-group select.error {
      border-color: var(--delete-btn);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
    }

    .error-msg {
      font-size: 0.75rem;
      color: var(--delete-btn);
      margin-top: 4px;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    /* Budget Limit Input */
    .limit-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .limit-row .form-group {
      flex: 1;
      margin-bottom: 0;
    }

    .btn-set-limit {
      padding: 11px 18px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-set-limit:hover {
      border-color: var(--accent-teal);
      color: var(--accent-teal);
    }

    /* ===== Add Button ===== */
    .btn-add {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.3px;
      margin-top: 4px;
    }

    .btn-add:hover  { opacity: 0.9; }
    .btn-add:active { transform: scale(0.99); }

    /* ===== Sort & Filter Bar ===== */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .list-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .sort-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .sort-controls select {
      padding: 6px 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
    }

    .sort-controls select:focus {
      border-color: var(--accent-purple);
    }

    /* ===== Transaction List ===== */
    .transaction-list {
      max-height: 340px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 2px;
    }

    .transaction-list::-webkit-scrollbar       { width: 4px; }
    .transaction-list::-webkit-scrollbar-track { background: var(--bg-input); border-radius: 10px; }
    .transaction-list::-webkit-scrollbar-thumb { background: var(--accent-purple); border-radius: 10px; }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .empty-state .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    /* ===== Transaction Item ===== */
    .transaction-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      transition: border-color 0.2s;
      animation: slideIn 0.25s ease;
    }

    .transaction-item:hover {
      border-color: rgba(124, 58, 237, 0.4);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tx-info    { display: flex; flex-direction: column; gap: 4px; }
    .tx-name    { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
    .tx-amount  { font-size: 1rem;   font-weight: 700; color: var(--accent-teal); }

    .tx-category {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .cat-food      { background: rgba(20, 184, 166, 0.15); color: var(--accent-teal); }
    .cat-transport { background: rgba(124, 58, 237, 0.15); color: #a78bfa; }
    .cat-fun       { background: rgba(245, 158, 11, 0.15); color: var(--accent-amber); }
    .cat-custom    { background: rgba(236, 72, 153, 0.15); color: var(--accent-pink); }

    .btn-delete {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: var(--radius-sm);
      color: var(--delete-btn);
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-delete:hover {
      background: var(--delete-btn);
      color: #fff;
    }

    /* ===== Bottom Grid (List + Chart) ===== */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    /* ===== Chart ===== */
    .chart-title   { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }

    .chart-wrapper {
      position: relative;
      max-width: 220px;
      margin: 0 auto;
    }

    .chart-no-data {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* ===== Monthly Summary ===== */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 4px;
    }

    .summary-item {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      text-align: center;
    }

    .summary-item .s-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .summary-item .s-value {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-teal);
    }

    /* ===== Custom Category Input ===== */
    .custom-category-row {
      display: none;
      gap: 8px;
      margin-top: 8px;
    }

    .custom-category-row.show { display: flex; }

    .custom-category-row input {
      flex: 1;
      padding: 9px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
    }

    .custom-category-row input:focus { border-color: var(--accent-purple); }

    .btn-add-cat {
      padding: 9px 14px;
      background: var(--accent-purple);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-add-cat:hover { opacity: 0.85; }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      .bottom-grid          { grid-template-columns: 1fr; }
      .balance-amount       { font-size: 2.2rem; }
      .app-header h1        { font-size: 1.1rem; }
      .sort-controls        { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="app-header">
    <div class="header-top">
      <h1>💰 Expense & Budget Visualizer</h1>
      <button class="theme-toggle" id="theme-toggle">🌙 Dark</button>
    </div>
  </header>

  <main class="container">

    <!-- ===== Total Balance ===== -->
    <div class="card balance-card">
      <div class="balance-label">Total Pengeluaran</div>
      <div class="balance-amount" id="total-balance">Rp 0</div>
      <div class="balance-sub" id="tx-count">0 transaksi</div>
      <div class="limit-banner" id="limit-banner">
        <span id="limit-banner-msg"></span>
      </div>
    </div>

    <!-- ===== Monthly Summary ===== -->
    <div class="card">
      <div class="form-title">📅 Ringkasan Bulan Ini</div>
      <div class="summary-grid" id="monthly-summary"></div>
    </div>

    <!-- ===== Add Transaction Form ===== -->
    <div class="card">
      <div class="form-title">➕ Tambah Transaksi</div>
      <form id="transaction-form" novalidate>

        <div class="form-group">
          <label for="item-name">Nama Item</label>
          <input type="text" id="item-name" placeholder="cth: Makan siang, Grab, dll" autocomplete="off" />
          <div class="error-msg" id="name-error">Nama item tidak boleh kosong.</div>
        </div>

        <div class="form-group">
          <label for="item-amount">Jumlah (Rp)</label>
          <input type="number" id="item-amount" placeholder="cth: 25000" min="1" />
          <div class="error-msg" id="amount-error">Masukkan jumlah yang valid (lebih dari 0).</div>
        </div>

        <div class="form-group">
          <label for="item-category">Kategori</label>
          <select id="item-category">
            <option value="">-- Pilih Kategori --</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
            <option value="custom">+ Tambah Kategori Baru</option>
          </select>
          <div class="error-msg" id="cat-error">Pilih kategori terlebih dahulu.</div>
          <div class="custom-category-row" id="custom-category-row">
            <input type="text" id="custom-cat-input" placeholder="Nama kategori baru..." />
            <button type="button" class="btn-add-cat" id="btn-add-cat">Tambah</button>
          </div>
        </div>

        <div class="form-group">
          <label for="limit-input">Batas Pengeluaran (Rp) — opsional</label>
          <div class="limit-row">
            <div class="form-group">
              <input type="number" id="limit-input" placeholder="cth: 500000" min="1" />
            </div>
            <button type="button" class="btn-set-limit" id="btn-set-limit">Set Limit</button>
          </div>
        </div>

        <button type="submit" class="btn-add">Tambah Transaksi</button>
      </form>
    </div>

    <!-- ===== Transaction List + Chart ===== -->
    <div class="bottom-grid">

      <div class="card">
        <div class="list-header">
          <div class="list-title">📋 Transaksi</div>
          <div class="sort-controls">
            <select id="sort-select" title="Urutkan">
              <option value="newest">Terbaru</option>
              <option value="amount-desc">Jumlah ↑</option>
              <option value="amount-asc">Jumlah ↓</option>
              <option value="cat-asc">Kategori A–Z</option>
              <option value="cat-desc">Kategori Z–A</option>
            </select>
          </div>
        </div>
        <div class="transaction-list" id="transaction-list"></div>
      </div>

      <div class="card">
        <div class="chart-title">📊 Pengeluaran per Kategori</div>
        <div class="chart-no-data" id="chart-no-data">Belum ada data untuk ditampilkan.</div>
        <div class="chart-wrapper" id="chart-wrapper" style="display:none">
          <canvas id="spending-chart"></canvas>
        </div>
      </div>

    </div>

  </main>

  <script>
    // ===== State =====
    let transactions     = JSON.parse(localStorage.getItem('transactions'))      || [];
    let spendingLimit    = parseFloat(localStorage.getItem('spendingLimit'))     || 0;
    let customCategories = JSON.parse(localStorage.getItem('customCategories'))  || [];
    let chartInstance    = null;

    // ===== DOM References =====
    const form           = document.getElementById('transaction-form');
    const nameInput      = document.getElementById('item-name');
    const amountInput    = document.getElementById('item-amount');
    const categorySelect = document.getElementById('item-category');
    const customCatRow   = document.getElementById('custom-category-row');
    const customCatInput = document.getElementById('custom-cat-input');
    const btnAddCat      = document.getElementById('btn-add-cat');
    const txList         = document.getElementById('transaction-list');
    const balanceEl      = document.getElementById('total-balance');
    const txCountEl      = document.getElementById('tx-count');
    const limitInput     = document.getElementById('limit-input');
    const limitBanner    = document.getElementById('limit-banner');
    const limitBannerMsg = document.getElementById('limit-banner-msg');
    const sortSelect     = document.getElementById('sort-select');
    const themeToggle    = document.getElementById('theme-toggle');
    const summaryEl      = document.getElementById('monthly-summary');
    const nameError      = document.getElementById('name-error');
    const amountError    = document.getElementById('amount-error');
    const catError       = document.getElementById('cat-error');

    // ===== Theme =====
    function initTheme() {
      const saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.body.classList.add('light-mode');
        themeToggle.textContent = '☀️ Light';
      } else {
        themeToggle.textContent = '🌙 Dark';
      }
    }

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      themeToggle.textContent = isLight ? '☀️ Light' : '🌙 Dark';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });

    // ===== Custom Categories =====
    function populateCategories() {
      const existing = Array.from(categorySelect.options).map(o => o.value);
      customCategories.forEach(cat => {
        if (!existing.includes(cat)) {
          const opt = document.createElement('option');
          opt.value = cat;
          opt.textContent = cat;
          categorySelect.insertBefore(opt, categorySelect.lastElementChild);
        }
      });
    }

    categorySelect.addEventListener('change', () => {
      if (categorySelect.value === 'custom') {
        customCatRow.classList.add('show');
        customCatInput.focus();
      } else {
        customCatRow.classList.remove('show');
      }
    });

    btnAddCat.addEventListener('click', () => {
      const newCat = customCatInput.value.trim();
      if (!newCat) return;
      if (!customCategories.includes(newCat)) {
        customCategories.push(newCat);
        localStorage.setItem('customCategories', JSON.stringify(customCategories));
        const opt = document.createElement('option');
        opt.value = newCat;
        opt.textContent = newCat;
        categorySelect.insertBefore(opt, categorySelect.lastElementChild);
      }
      categorySelect.value = newCat;
      customCatRow.classList.remove('show');
      customCatInput.value = '';
    });

    // ===== Spending Limit =====
    document.getElementById('btn-set-limit').addEventListener('click', () => {
      const val = parseFloat(limitInput.value);
      if (!isNaN(val) && val > 0) {
        spendingLimit = val;
        localStorage.setItem('spendingLimit', val);
        checkLimit();
      } else {
        spendingLimit = 0;
        localStorage.removeItem('spendingLimit');
        limitBanner.classList.remove('show');
      }
    });

    function checkLimit() {
      if (!spendingLimit) { limitBanner.classList.remove('show'); return; }
      const total = transactions.reduce((s, t) => s + t.amount, 0);
      if (total > spendingLimit) {
        limitBannerMsg.textContent =
          `⚠️ Total spending (Rp ${formatNumber(total)}) melebihi batas (Rp ${formatNumber(spendingLimit)})!`;
        limitBanner.classList.add('show');
      } else {
        limitBanner.classList.remove('show');
      }
    }

    // ===== Validation =====
    function validateForm() {
      let valid = true;

      if (!nameInput.value.trim()) {
        nameInput.classList.add('error'); nameError.classList.add('show'); valid = false;
      } else {
        nameInput.classList.remove('error'); nameError.classList.remove('show');
      }

      const amt = parseFloat(amountInput.value);
      if (!amountInput.value || isNaN(amt) || amt <= 0) {
        amountInput.classList.add('error'); amountError.classList.add('show'); valid = false;
      } else {
        amountInput.classList.remove('error'); amountError.classList.remove('show');
      }

      if (!categorySelect.value || categorySelect.value === 'custom') {
        categorySelect.classList.add('error'); catError.classList.add('show'); valid = false;
      } else {
        categorySelect.classList.remove('error'); catError.classList.remove('show');
      }

      return valid;
    }

    // ===== Add Transaction =====
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!validateForm()) return;

      const tx = {
        id: Date.now(),
        name: nameInput.value.trim(),
        amount: parseFloat(amountInput.value),
        category: categorySelect.value,
        date: new Date().toISOString(),
      };

      transactions.unshift(tx);
      saveAndRender();
      form.reset();
      customCatRow.classList.remove('show');
    });

    // ===== Delete Transaction =====
    function deleteTransaction(id) {
      transactions = transactions.filter(t => t.id !== id);
      saveAndRender();
    }

    // ===== Save & Render =====
    function saveAndRender() {
      localStorage.setItem('transactions', JSON.stringify(transactions));
      renderBalance();
      renderList();
      renderChart();
      renderSummary();
      checkLimit();
    }

    // ===== Format Helpers =====
    function formatNumber(n)   { return n.toLocaleString('id-ID'); }
    function formatCurrency(n) { return 'Rp ' + formatNumber(n); }

    // ===== Render Balance =====
    function renderBalance() {
      const total = transactions.reduce((s, t) => s + t.amount, 0);
      balanceEl.textContent  = formatCurrency(total);
      txCountEl.textContent  = `${transactions.length} transaksi`;
    }

    // ===== Category CSS Class =====
    function getCatClass(cat) {
      const map = { Food: 'cat-food', Transport: 'cat-transport', Fun: 'cat-fun' };
      return map[cat] || 'cat-custom';
    }

    // ===== Sort Transactions =====
    function getSorted() {
      const mode = sortSelect.value;
      const list = [...transactions];
      if (mode === 'amount-asc')  return list.sort((a, b) => a.amount - b.amount);
      if (mode === 'amount-desc') return list.sort((a, b) => b.amount - a.amount);
      if (mode === 'cat-asc')     return list.sort((a, b) => a.category.localeCompare(b.category));
      if (mode === 'cat-desc')    return list.sort((a, b) => b.category.localeCompare(a.category));
      return list;
    }

    sortSelect.addEventListener('change', renderList);

    // ===== Render Transaction List =====
    function renderList() {
      const sorted = getSorted();
      if (sorted.length === 0) {
        txList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">💸</div>
            <p>Belum ada transaksi. Tambahkan pengeluaran pertamamu!</p>
          </div>`;
        return;
      }
      txList.innerHTML = sorted.map(tx => `
        <div class="transaction-item" data-id="${tx.id}">
          <div class="tx-info">
            <span class="tx-name">${escapeHtml(tx.name)}</span>
            <span class="tx-amount">${formatCurrency(tx.amount)}</span>
            <span class="tx-category ${getCatClass(tx.category)}">${escapeHtml(tx.category)}</span>
          </div>
          <button class="btn-delete" onclick="deleteTransaction(${tx.id})">Hapus</button>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ===== Render Chart =====
    function renderChart() {
      const ctx          = document.getElementById('spending-chart').getContext('2d');
      const noData       = document.getElementById('chart-no-data');
      const chartWrapper = document.getElementById('chart-wrapper');

      if (transactions.length === 0) {
        noData.style.display       = 'block';
        chartWrapper.style.display = 'none';
        if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
        return;
      }

      noData.style.display       = 'none';
      chartWrapper.style.display = 'block';

      const totals = {};
      transactions.forEach(t => { totals[t.category] = (totals[t.category] || 0) + t.amount; });

      const labels  = Object.keys(totals);
      const data    = Object.values(totals);
      const palette = ['#14b8a6', '#7c3aed', '#f59e0b', '#ec4899', '#3b82f6', '#10b981', '#f97316', '#8b5cf6'];
      const colors  = labels.map((_, i) => palette[i % palette.length]);

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'pie',
        data: {
          labels,
          datasets: [{ data, backgroundColor: colors, borderColor: 'transparent', hoverOffset: 10 }],
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                color: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim() || '#94a3b8',
                font: { size: 11 },
                padding: 12,
                usePointStyle: true,
              },
            },
            tooltip: {
              callbacks: { label: ctx => ` ${ctx.label}: ${formatCurrency(ctx.raw)}` },
            },
          },
        },
      });
    }

    // ===== Monthly Summary =====
    function renderSummary() {
      const now = new Date();
      const thisMonth = transactions.filter(t => {
        const d = new Date(t.date);
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      });

      const total   = thisMonth.reduce((s, t) => s + t.amount, 0);
      const biggest = thisMonth.reduce((max, t) => t.amount > max ? t.amount : max, 0);
      const catCounts = {};
      thisMonth.forEach(t => catCounts[t.category] = (catCounts[t.category] || 0) + 1);
      const topCat = Object.entries(catCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || '-';

      summaryEl.innerHTML = `
        <div class="summary-item">
          <div class="s-label">Bulan Ini</div>
          <div class="s-value">${formatCurrency(total)}</div>
        </div>
        <div class="summary-item">
          <div class="s-label">Transaksi</div>
          <div class="s-value">${thisMonth.length}</div>
        </div>
        <div class="summary-item">
          <div class="s-label">Terbesar</div>
          <div class="s-value">${biggest ? formatCurrency(biggest) : '-'}</div>
        </div>
        <div class="summary-item">
          <div class="s-label">Kategori Utama</div>
          <div class="s-value">${topCat}</div>
        </div>
      `;
    }

    // ===== Init =====
    initTheme();
    populateCategories();
    if (spendingLimit) limitInput.value = spendingLimit;
    saveAndRender();
  </script>

</body>
</html>
